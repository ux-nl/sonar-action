# Sonar: add this job to an existing workflow.
#
# Every job that produces reports must write them into reports/ and upload
# them as an artifact named reports-<job> (see the example below), so this
# final job can merge them, write health.json and send everything to Sonar.
#
#   - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
#     if: always()
#     with:
#       name: reports-tests
#       path: reports/
#
# The action sends to https://sonar.ux.nl; pass `sonar-url` under `with:` to use another instance.

  sonar:
    name: Sonar
    needs: [tests]
    if: always()
    # Change runs-on: ubuntu-latest to ubuntu-latest if you do not use self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - uses: ux-nl/sonar-action@f5772d53ad07d6b14e3a18eae74675c47e771b29 # v1.1.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sonar-reports
          path: reports/
